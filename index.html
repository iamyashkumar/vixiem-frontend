<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Vixiem | API Intelligence & Endpoint Monitoring Platform</title>
    <meta name="title" content="Vixiem | API Intelligence & Endpoint Monitoring Platform" />
    <meta name="description" content="Vixiem is a real-time API monitoring and automated health intelligence platform. Track latency, detect downtime, receive instant alerts, and run AI-powered error diagnostics." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vixiem.vercel.app/" />
    <meta property="og:title" content="Vixiem | API Intelligence & Endpoint Monitoring Platform" />
    <meta property="og:description" content="Vixiem is a real-time API monitoring and automated health intelligence platform. Track latency, detect downtime, receive instant alerts, and run AI-powered error diagnostics." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vixiem.vercel.app/" />
    <meta property="twitter:title" content="Vixiem | API Intelligence & Endpoint Monitoring Platform" />
    <meta property="twitter:description" content="Vixiem is a real-time API monitoring and automated health intelligence platform. Track latency, detect downtime, receive instant alerts, and run AI-powered error diagnostics." />

    <!-- Preconnect to Backend API to eliminate TLS/DNS handshake latency -->
    <link rel="preconnect" href="https://vixiem-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://vixiem-backend.onrender.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
    </noscript>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
